baseURL = "https://mayx619.github.io/"
languageCode = "zh-cn"
title = "Yuxiang Ma - Academic Homepage"
theme = "Scholar-Lite"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      hardWraps = false
      xhtml = false
    [markup.goldmark.parser]
      attribute = true
      autoHeadingID = true
      autoHeadingIDType = "github"
      wrapStandAloneImageWithinParagraph = false
    [markup.goldmark.extensions]
      typographer = false
      linkify = false
      strikethrough = false
      definitionList = false
      footnote = false
      table = true
      taskList = false
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$'], ['\\[', '\\]']]
        inline = [['$', '$'], ['\\(', '\\)']]
  [markup.highlight]
    style = 'github'
    lineNos = false
    lineNumbersInTable = false
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ''
    hl_inline = false
    noClasses = false
    noHl = false
    tabWidth = 4

[taxonomies]
    venue = "venue"
    tag = "tags"
    
[params]
    profilePhoto = "/images/profile.svg"
    bio = """
    I am Yuxiang Ma, a researcher at Xi'an Jiaotong University.

    My research interests include statistical learning, machine learning, and related topics.
    """
    
[[params.social]]
    name = "Google Scholar"
    url = "https://scholar.google.com/citations?user=5vqM9GQAAAAJ&hl=zh-CN"
    
[[params.social]]
    name = "GitHub"
    url = "https://github.com/Mayx619"
    
[[params.social]]
    name = "Email"
    url = "3124307009@stu.xjtu.edu.cn"
